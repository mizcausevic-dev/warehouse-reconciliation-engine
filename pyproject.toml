[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-reconciliation-engine"
version = "0.1.0"
description = "Python warehouse reconciliation backend for source-to-warehouse drift detection and settlement reporting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn>=0.38.0,<1.0.0",
  "pydantic>=2.12.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<10.0.0"
]

[project.scripts]
warehouse-reconciliation-engine = "app.cli:main"

[tool.setuptools]
packages = ["app", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
